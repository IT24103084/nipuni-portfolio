<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0277bd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGradient2)"/>
  
  <!-- Credit card shape -->
  <rect x="200" y="140" width="400" height="200" rx="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  
  <!-- Chip -->
  <rect x="240" y="180" width="50" height="50" rx="5" fill="rgba(255,215,0,0.6)" stroke="rgba(255,215,0,0.9)" stroke-width="2"/>
  
  <!-- Checkmark inside -->
  <circle cx="265" cy="205" r="20" fill="rgba(76,175,80,0.7)"/>
  <path d="M 258 205 L 263 210 L 273 200" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Risk indicator bars -->
  <rect x="320" y="190" width="30" height="15" rx="3" fill="rgba(76,175,80,0.7)"/>
  <rect x="360" y="190" width="30" height="30" rx="3" fill="rgba(255,193,7,0.7)"/>
  <rect x="400" y="190" width="30" height="45" rx="3" fill="rgba(244,67,54,0.5)"/>
  
  <!-- Text -->
  <text x="400" y="40" font-family="Inter, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">
    Credit Risk Prediction
  </text>
  <text x="400" y="420" font-family="Inter, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    Smart loan assessment models
  </text>
</svg>