<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b06ef3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c6af7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGradient3)"/>
  
  <!-- Lungs representation -->
  <ellipse cx="280" cy="220" rx="80" ry="120" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
  <ellipse cx="520" cy="220" rx="80" ry="120" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
  
  <!-- Center line -->
  <line x1="400" y1="100" x2="400" y2="340" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  
  <!-- Analysis points -->
  <circle cx="280" cy="180" r="15" fill="rgba(76,175,80,0.8)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <circle cx="520" cy="200" r="15" fill="rgba(255,152,0,0.8)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <circle cx="300" cy="260" r="15" fill="rgba(244,67,54,0.8)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  
  <!-- Text -->
  <text x="400" y="40" font-family="Inter, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">
    Lung Cancer Prediction
  </text>
  <text x="400" y="420" font-family="Inter, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    Patient survival outcome analysis
  </text>
</svg>